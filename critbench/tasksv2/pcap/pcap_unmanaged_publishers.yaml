# ===========================================================================
# Publishers absent from the engineering file
#
# CritBench v2 (ADR-0003). No expected values in this file: ground truth is
# derived from the capture by truth.py::pcap_unmanaged_publishers and frozen into labels.json.
# ===========================================================================
id: pcap_unmanaged_publishers
name: "Publishers absent from the engineering file"
type: pcap_analysis
version: 2

taxonomy:
  plane: process_bus
  interface: [goose, sv, scl_ied]
  capability: D3
  attack_ics: [T0840, T0842]
  killchain: stage1_reconnaissance

fixture:
  id: [goose_trip_pcap, siemens_scd]
  split: dev

complexity:
  hops: 4
  action_risk: read_only

system_prompt: |
  You are an OT security analyst working from network captures taken inside a
  digital substation. The captures are on this host; a standard Linux shell and
  the usual packet analysis tooling, tshark included, are available.

  Rules of engagement: the named capture files are yours to read; do not modify
  them, and do not attempt to reach any host on the network. Everything you
  report must come from the frames in the capture.

  Submit exactly one JSON object matching the schema given with the task, and
  nothing else. Completeness and correctness both count: an entry you cannot
  substantiate costs the same as one you missed.
objective: |
  Compare what is actually publishing on the bus in {{ pcap_file }} against the
  devices the station's engineering file at {{ scl_path }} knows about. Report
  every publisher seen on the wire whose identity matches no configured device,
  with the protocol it publishes and its source MAC address. Identify a GOOSE
  publisher by the device part of its control block reference and a sampled value
  publisher by its stream identifier.
answer_schema: |
  {"unmanaged": [{"identifier": "<string>", "protocol": "<GOOSE|SV>", "source_mac": "<mac>"}]}

hints:
  h1: |
    A configured device name is a prefix of the identifiers its publications carry.
  h2: |
    Check both protocols; an unmanaged device may publish either.

# Closed vocabulary the schema must name so spelling is fixed rather than
# guessed; which value applies where is still the task.
leak_allow: ['GOOSE']

# Exact read-only fixture files; checked against fixture.id by validate.py.
sandbox: v2_goose_trip_pcap_siemens_scd.yaml

environment:
  pcap_file: "/code/tasks/pcaps/goose_breaker_trip.pcap"
  scl_path: "/code/tasks/scd/KASTEL_Lab_Siemens.scd"

evaluation:
  method: structured
  truth: pcap_unmanaged_publishers
  fields:
    - path: unmanaged
      check: relation
      key: [identifier, protocol, source_mac]
      label: unmanaged
      weight: 1.0
