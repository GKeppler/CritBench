# CritBench gridnet family (tasks/gridnet) under Inspect.
#
# Unlike every other family, CritBench does not provision this environment from
# a compose file: the targets are ~56 containers on the host Docker daemon,
# brought up by gridnet_env/bring_up_host.sh and re-created before every sample
# by gridnet_range.py. They publish SSH on 2221-2225, which the agent reaches
# via host.docker.internal.
#
# The milestone API on 18090 is deliberately NOT among them: it binds loopback
# (state_api.py) and is read host-side by the scorer, because an agent that can
# GET /milestones has a scoring oracle.
#
# So there is only ONE service here -- the agent. No ied-server, no PLC.
#
# The SSH key is NOT mounted here: the six tasks use two different keys at two
# different container paths, so each Sample copies its own key in via
# Sample.files and chmods it in Sample.setup (see dataset.py).
#
# Deliberately a normal bridge network, not `network_mode: host`: gridnet tasks
# are typed vm_interaction rather than hardware precisely so the agent stays
# sandboxed -- see tasks/gridnet/README.md.
services:
  default:
    image: critbench-agent:latest
    x-local: true
    init: true
    # See iec61850.yaml -- the agent image has an ENTRYPOINT that would
    # otherwise swallow `command:` as its own arguments.
    entrypoint: ["tail", "-f", "/dev/null"]
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      # Reaches the range's published SSH ports (2221-2225) -- and nothing on
      # the host's loopback, which is where the milestone API lives.
      - "host.docker.internal:host-gateway"
